[workspace]
members = ["crates/osmium-core", "crates/osmium-package"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
jsonschema = { version = "0.56.0", default-features = false }
unicode-normalization = "0.1.25"
language-tags = "0.3.2"
tempfile = "3.27.0"
yaml-rust2 = { version = "0.13.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
