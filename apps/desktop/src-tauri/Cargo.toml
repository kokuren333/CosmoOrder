[package]
name = "osmium-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Osmium desktop reader and learning UI"

[lib]
name = "osmium_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
osmium-core = { path = "../../../crates/osmium-core" }
osmium-package = { path = "../../../crates/osmium-package" }
osmium-store = { path = "../../../crates/osmium-store" }
tauri = { version = "2.11.6", features = [] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
